name: Deploy
# Runs only after CI succeeds on main.  Vercel deploys the frontend from the same push automatically
# (Git integration); this workflow publishes container images and triggers the Render API deploy.
on:
  workflow_run: { workflows: [CI], types: [completed], branches: [main] }
  workflow_dispatch:

permissions: { contents: read, packages: write }

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        run: echo "repo=$(echo ${GITHUB_REPOSITORY} | tr A-Z a-z)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with: { context: ./backend, push: true, tags: "ghcr.io/${{ steps.meta.outputs.repo }}-api:latest,ghcr.io/${{ steps.meta.outputs.repo }}-api:${{ github.sha }}" }
      - uses: docker/build-push-action@v6
        with: { context: ./frontend, push: true, tags: "ghcr.io/${{ steps.meta.outputs.repo }}-web:latest,ghcr.io/${{ steps.meta.outputs.repo }}-web:${{ github.sha }}" }

  render:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env: { HOOK: "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" }
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set - skipping (Render may auto-deploy from Git)"; exit 0; fi
          curl -fsS -X POST "$HOOK"
      - name: Wait for the API to be healthy
        env: { URL: "${{ vars.API_URL }}" }
        run: |
          if [ -z "$URL" ]; then echo "API_URL variable not set - skipping health check"; exit 0; fi
          for i in $(seq 1 30); do curl -fsS "$URL/health/" && exit 0; sleep 10; done
          echo "API did not become healthy"; exit 1
