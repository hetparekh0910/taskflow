name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: taskflow, POSTGRES_PASSWORD: taskflow, POSTGRES_DB: taskflow }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
      SECRET_KEY: ci
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Django system checks
        run: python manage.py check
      - name: Tests (PostgreSQL) with coverage
        run: pytest --cov=apps --cov-report=term --cov-report=xml --cov-fail-under=85 --junitxml=test-results.xml
      - name: OpenAPI schema generates without errors
        run: python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn || python manage.py spectacular --file /tmp/schema.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: "backend/test-results.xml\nbackend/coverage.xml" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      # `npm ci` is strict; fall back to `npm install` if a lockfile made on another OS lacks Linux native packages
      - run: npm ci || npm install
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max", load: true, tags: taskflow-api:ci }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max", tags: taskflow-web:ci }
      - name: Smoke test the full stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
          curl -fsS http://localhost:8080/ >/dev/null
          curl -fsS http://localhost:8080/api/schema/ >/dev/null
          docker compose exec -T api python manage.py seed_demo
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login/ -H 'Content-Type: application/json' \
                  -d '{"email":"alice@acme.test","password":"demo12345"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access'])")
          curl -fsS http://localhost:8080/api/w/acme-robotics/dashboard/ -H "Authorization: Bearer $TOKEN" | grep -q '"totals"'
          docker compose logs worker beat | tail -n 20
      - if: failure()
        run: docker compose logs --no-color | tail -n 200
