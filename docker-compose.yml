# One command to run the whole stack:   docker compose up --build
# Web UI  -> http://localhost:8080      API docs -> http://localhost:8080/api/docs/
# Demo data (optional):                 docker compose exec api python manage.py seed_demo
x-backend: &backend
  build: ./backend
  env_file: [{ path: .env, required: false }]   # optional: the defaults below are enough for a local demo
  environment: &backend-env
    SECRET_KEY: ${SECRET_KEY:-compose-demo-only-key-change-me-for-real-use}
    DATABASE_URL: postgres://taskflow:${POSTGRES_PASSWORD:-taskflow}@db:5432/taskflow
    REDIS_URL: redis://redis:6379/0
    CELERY_EAGER: "0"
    MEDIA_ROOT: /app/media
  volumes: [media:/app/media]
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: taskflow, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-taskflow}", POSTGRES_DB: taskflow }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U taskflow"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  api:
    <<: *backend
    environment: { <<: *backend-env, RUN_MIGRATIONS: "1" }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/')"], interval: 10s, timeout: 5s, retries: 10 }

  worker:   # Celery worker: webhook delivery, notification emails, weekly reports
    <<: *backend
    environment: { <<: *backend-env, RUN_MIGRATIONS: "0" }
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency", "2"]
    depends_on: { api: { condition: service_healthy } }

  beat:     # Celery beat: weekly report + webhook retry sweep
    <<: *backend
    environment: { <<: *backend-env, RUN_MIGRATIONS: "0" }
    command: ["celery", "-A", "config", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    depends_on: { api: { condition: service_healthy } }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

volumes: { pgdata: {}, media: {} }
