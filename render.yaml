# Render Blueprint: New + > Blueprint > pick this repo.  Free tier: API + Postgres.
# Background jobs run inline (CELERY_EAGER) because Render's free plan has no worker dynos.
# Upgrade path: add a `worker` + `redis` and set REDIS_URL / CELERY_EAGER=0 - no code changes.
services:
  - type: web
    name: taskflow-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && (if [ "$SEED_DEMO" = "1" ]; then python manage.py seed_demo; fi) && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2
    healthCheckPath: /health/
    envVars:
      - { key: PYTHON_VERSION, value: 3.13.1 }
      - { key: DEBUG, value: "0" }
      - { key: SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, fromDatabase: { name: taskflow-db, property: connectionString } }
      - { key: ALLOWED_HOSTS, value: ".onrender.com" }
      - { key: CELERY_EAGER, value: "1" }
      - { key: SEED_DEMO, value: "1" }              # loads the two demo companies on boot (idempotent). Set to 0 for real use.
      - { key: SECURE_SSL_REDIRECT, value: "0" }   # Render terminates TLS; the proxy header is already trusted
      - { key: FRONTEND_URL, sync: false }          # your Vercel URL, e.g. https://taskflow.vercel.app
      - { key: CORS_ALLOWED_ORIGINS, sync: false }  # same URL
      - { key: CSRF_TRUSTED_ORIGINS, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: STRIPE_PRICE_PRO, sync: false }
      - { key: STRIPE_PRICE_BUSINESS, sync: false }
databases:
  - name: taskflow-db
    plan: free
