server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /admin/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
  location /static/ { proxy_pass http://api:8000; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }   # SPA fallback
}
